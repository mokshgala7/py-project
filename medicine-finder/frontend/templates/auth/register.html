{% extends "base.html" %}
{% block title %}Register — MedFind{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-card__header">
            <span class="auth-card__icon">✚</span>
            <h1 class="auth-card__title">Join MedFind</h1>
            <p class="auth-card__sub">Create your free account today</p>
        </div>
        <form class="auth-form" action="{{ url_for('auth.register') }}" method="POST" id="registerForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-input" placeholder="Jane Doe" required>
                <span class="form-error" id="nameError"></span>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
                <span class="form-error" id="emailError"></span>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                    <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">👁</button>
                </div>
                <span class="form-error" id="passwordError"></span>
            </div>
            <div class="form-group">
                <label class="form-label" for="role">Account Type</label>
                <select id="role" name="role" class="form-input form-select" required>
                    <option value="" disabled selected>Select account type</option>
                    <option value="user">User — Search for medicines</option>
                    <option value="pharmacy">Pharmacy — Manage inventory</option>
                </select>
                <span class="form-error" id="roleError"></span>
            </div>
            <div class="form-group pharmacy-location-field">
                <label class="form-label" for="street">Store Street Address</label>
                <input type="text" id="street" name="street" class="form-input" placeholder="e.g. 12 MG Road">
            </div>
            <div class="form-group pharmacy-location-field">
                <label class="form-label" for="city">City</label>
                <input type="text" id="city" name="city" class="form-input" placeholder="e.g. Bengaluru">
            </div>
            <div class="form-group pharmacy-location-field">
                <label class="form-label" for="state">State</label>
                <input type="text" id="state" name="state" class="form-input" placeholder="e.g. Karnataka">
            </div>
            <div class="form-group pharmacy-location-field">
                <label class="form-label" for="pincode">Pincode</label>
                <input type="text" id="pincode" name="pincode" class="form-input" placeholder="e.g. 560001">
            </div>
            <div class="form-group pharmacy-location-field">
                <label class="form-label" for="country">Country (optional)</label>
                <input type="text" id="country" name="country" class="form-input" placeholder="e.g. India">
            </div>
            <button type="submit" class="btn btn--primary btn--full">Create Account</button>
        </form>
        <div class="auth-card__footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="auth-link">Sign in</a></p>
        </div>
    </div>
    <div class="auth-deco" aria-hidden="true">
        <span>MEDFIND</span>
        <span>MEDFIND</span>
        <span>MEDFIND</span>
    </div>
</section>
{% endblock %}
