{% extends "base.html" %}
{% block title %}Login — MedFind{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="auth-card__header">
            <span class="auth-card__icon">✚</span>
            <h1 class="auth-card__title">Welcome Back</h1>
            <p class="auth-card__sub">Sign in to your MedFind account</p>
        </div>
        <form class="auth-form" action="{{ url_for('auth.login') }}" method="POST" id="loginForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" required>
                <span class="form-error" id="emailError"></span>
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required>
                    <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password visibility">👁</button>
                </div>
                <span class="form-error" id="passwordError"></span>
            </div>
            <button type="submit" class="btn btn--primary btn--full">Sign In</button>
        </form>
        <div class="auth-card__footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}" class="auth-link">Register here</a></p>
        </div>
    </div>
    <div class="auth-deco" aria-hidden="true">
        <span>MEDFIND</span>
        <span>MEDFIND</span>
        <span>MEDFIND</span>
    </div>
</section>
{% endblock %}
